<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>H3 Studio · 图生视频</title>
<style>
  :root{--bg:#141416;--panel:#1c1c21;--line:#2a2a31;--txt:#e6e6ea;--dim:#8b8b96;--acc:#4c8dff;--ok:#3ecf8e;--warn:#f5a524;--err:#f0506e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  header h1{font-size:15px;margin:0;font-weight:600}
  #dot{width:9px;height:9px;border-radius:50%;background:#666}
  #dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  header .right{margin-left:auto;color:var(--dim);font-size:12px}
  main{display:grid;grid-template-columns:380px 1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.04em}
  #drop{border:1.5px dashed #3a3a44;border-radius:10px;padding:18px;text-align:center;color:var(--dim);cursor:pointer;transition:.15s}
  #drop.hot{border-color:var(--acc);color:var(--acc);background:#1b2433}
  #thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb b{position:absolute;top:0;left:0;background:#000a;color:#fff;font-size:10px;padding:0 4px;border-radius:0 0 6px 0}
  .thumb button{position:absolute;top:1px;right:1px;background:#000b;color:#fff;border:0;border-radius:50%;width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer}
  textarea{width:100%;min-height:120px;background:#16161a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.6 inherit;resize:vertical}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .row label{color:var(--dim);font-size:12px;min-width:56px}
  input[type=range]{flex:1;accent-color:var(--acc)}
  select,input[type=number]{background:#16161a;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:13px inherit;flex:1;min-width:0}
  .pill{font-size:12px;color:var(--dim)}
  button.primary{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  button.primary:disabled{background:#333;color:#777;cursor:not-allowed}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);cursor:pointer;font:13px inherit}
  .tabs button.active{background:#22304a;color:#cfe2ff;border-color:#2f4a75}
  #progressWrap{display:none;margin-top:12px}
  .bar{height:6px;background:#232329;border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d6fd6,#63a4ff);transition:width .3s}
  .status{font-size:12px;color:var(--dim);margin-top:6px;display:flex;justify-content:space-between}
  .stage{display:flex;min-height:420px;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:var(--dim);text-align:center;padding:20px}
  video{width:100%;border-radius:10px;background:#000}
  .meta{display:flex;gap:16px;color:var(--dim);font-size:12px;margin-top:8px;flex-wrap:wrap}
  .actions{display:flex;gap:8px;margin-top:10px}
  .actions a,.actions button{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#1e1e24;color:var(--txt);text-decoration:none;font-size:13px;cursor:pointer}
  .actions a:hover,.actions button:hover{border-color:var(--acc)}
  .hist{margin-top:14px;max-height:220px;overflow:auto}
  .hist div{display:flex;gap:8px;font-size:12px;color:var(--dim);padding:4px 0;border-bottom:1px solid #222}
  .hist span:first-child{color:var(--txt)}
  .err{color:var(--err);font-size:12px;margin-top:8px;white-space:pre-wrap}
  .lib{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:430px;overflow:auto;padding-right:2px}
  .lib .item{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;background:#16161a;transition:.12s}
  .lib .item .no{position:absolute;top:4px;left:4px;background:#000c;color:#ffd24a;font-size:11px;padding:1px 6px;border-radius:6px;font-weight:600}
  .libhead input{width:64px;background:#16161a;border:1px solid var(--line);color:var(--txt);border-radius:6px;font-size:11px;padding:3px 6px}
  .libhead .sp{display:flex;gap:6px;align-items:center}
  .lib .item:hover{border-color:var(--acc);transform:translateY(-1px)}
  .lib .item img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;background:#0e0e11}
  .lib .item .cap{font-size:11px;color:var(--dim);padding:3px 6px;display:flex;justify-content:space-between}
  .lib .item .cap b{color:#cfd3da;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .libhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .libhead button{background:#1e1e24;border:1px solid var(--line);color:var(--dim);border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer}
</style>
</head>
<body>
<header>
  <span id="dot"></span><h1>H3 Studio · 图生视频</h1>
  <span class="right">MiniMax-H3 ref2va · 768×1024 · <span id="comfyState">检测中…</span></span>
</header>
<main>
  <section>
    <div class="card">
      <h2>参考图（最多 7 张）</h2>
      <div id="drop">点击或拖入图片<br><span class="pill">支持 png / jpg / webp</span></div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div id="thumbs"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>提示词</h2>
      <textarea id="prompt">参考 <Picture 1>–<Picture 7> 中的同一角色：外貌、服装、发型与画风以参考图为准，不要改变。

[Shot 1] 固定镜头，close-up portrait，head and shoulders，人物上半身近景。
0.0–1.5 秒：双手举到脸旁做猫爪，歪头眨眼。
1.5–3.0 秒：双手在胸前比出爱心，轻轻晃动。

镜头固定，面部清晰，细节丰富。</textarea>
      <div class="row">
        <label>时长</label>
        <input id="dur" type="range" min="1" max="15" step="0.5" value="3">
        <span class="pill" id="durLabel" style="min-width:96px;text-align:right"></span>
      </div>
      <div class="row">
        <label>模式</label>
        <div class="tabs" style="flex:1;margin:0">
          <button id="modeSingle" class="active">单段生成</button>
          <button id="modeCont">衔接上一段</button>
        </div>
      </div>
      <div id="contBox" style="display:none">
        <div class="row">
          <label>衔接源</label>
          <select id="contVideo"></select>
        </div>
        <div class="row">
          <label>或上传</label>
          <input id="anchorFile" type="file" accept="image/*">
        </div>
        <div class="pill" id="anchorHint">不选则使用所选视频的最后一帧作为锚点</div>
      </div>
      <button id="go" class="primary">开始生成</button>
      <div id="progressWrap">
        <div class="bar"><i id="bar"></i></div>
        <div class="status"><span id="stageTxt">排队中…</span><span id="timeTxt"></span></div>
      </div>
      <div id="err" class="err"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="libhead"><h2 style="margin:0">作品库 <span class="pill" id="libCount"></span></h2>
        <div class="sp"><input id="jumpNo" type="number" min="1" placeholder="编号"><button id="jumpGo">播放</button><button id="libRefresh">刷新</button></div>
      </div>
      <div class="lib" id="lib"><span class="pill">加载中…</span></div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>本次生成记录</h2>
      <div class="hist" id="hist"><span class="pill">还没有记录</span></div>
    </div>
  </section>

  <section class="card">
    <h2>结果</h2>
    <div id="stage" class="stage">生成后视频会显示在这里</div>
    <div class="meta" id="meta"></div>
    <div class="actions" id="actions" style="display:none">
      <a id="dl" download>下载 mp4</a>
      <button id="contThis">以此续接下一段</button>
    </div>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
let images = [];          // ComfyUI input 里的文件名
let mode = 'single';
let current = null;       // 当前 job
let contAnchor = null;    // {type:'video'|'image', value:''}

function setMode(m){
  mode = m;
  $('#modeSingle').classList.toggle('active', m==='single');
  $('#modeCont').classList.toggle('active', m==='continue');
  $('#contBox').style.display = m==='continue' ? 'block' : 'none';
}
$('#modeSingle').onclick = ()=>setMode('single');
$('#modeCont').onclick = ()=>setMode('continue');

function durText(v){
  const f = Math.max(5, Math.round(v*24));
  const frames = f + (5 - f%17)%17;
  return `${v} 秒 · ${frames} 帧`;
}
$('#dur').oninput = e => $('#durLabel').textContent = durText(e.target.value);
$('#durLabel').textContent = durText(3);

// 上传
async function upload(files){
  if(!files || !files.length) return;
  const fd = new FormData();
  [...files].forEach(f => fd.append('images', f));
  $('#stageTxt') && ($('#err').textContent = '');
  const r = await fetch('/api/upload', {method:'POST', body:fd});
  const j = await r.json();
  images = images.concat(j.names || []).slice(0,7);
  renderThumbs();
}
$('#drop').onclick = ()=>$('#file').click();
$('#file').onchange = e => upload(e.target.files);
['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev, e=>{e.preventDefault();$('#drop').classList.add('hot')}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev, e=>{e.preventDefault();$('#drop').classList.remove('hot')}));
$('#drop').addEventListener('drop', e=>upload(e.dataTransfer.files));

function renderThumbs(){
  const box = $('#thumbs');
  box.innerHTML = '';
  images.forEach((name, i)=>{
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<b>${i+1}</b><img src="/api/inputimg/${encodeURIComponent(name)}">
      <button title="移除">×</button>`;
    d.querySelector('button').onclick = ()=>{images.splice(i,1);renderThumbs();};
    box.appendChild(d);
  });
}

// 提示词/时长/模式 → 生成
$('#go').onclick = async ()=>{
  $('#err').textContent = '';
  if(mode==='continue' && !contAnchor){
    const sel = $('#contVideo').value;
    if(sel) contAnchor = {type:'video', value: sel};
  }
  const body = {
    prompt: $('#prompt').value,
    duration: parseFloat($('#dur').value),
    images,
    mode,
    anchor: mode==='continue' ? (contAnchor && contAnchor.value) : null
  };
  const r = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if(!r.ok){ $('#err').textContent = j.error || '提交失败'; return; }
  current = j.job;
  $('#go').disabled = true;
  $('#progressWrap').style.display='block';
  $('#bar').style.width = '2%';
  $('#stageTxt').textContent = `已提交 · ${j.frames} 帧`;
  poll(current);
};

async function poll(id){
  const t0 = Date.now();
  while(true){
    await new Promise(r=>setTimeout(r,1500));
    const r = await fetch(`/api/job/${id}`);
    if(!r.ok){
      // WebUI 重启过，旧任务记录没了：尝试接上正在跑的那条
      let attached = null;
      try{
        const rj = await fetch('/api/jobs'); const jj = await rj.json();
        attached = (jj.items||[]).find(x => x.state==='running' || x.state==='queued');
      }catch(e){}
      if(attached){
        id = attached.id; current = attached.id;
        $('#err').textContent = '已重新接上任务 ' + attached.id;
        continue;
      }
      $('#err').textContent='任务记录丢失（WebUI 重启过）。生成结果仍在输出目录，可在「衔接源」下拉里找到。';
      $('#go').disabled = false;
      break;
    }
    const j = await r.json();
    const p = j.progress || {};
    const pct = p.total ? Math.max(2, Math.round(p.step/p.total*100)) : 5;
    $('#bar').style.width = pct + '%';
    $('#timeTxt').textContent = `${Math.round((Date.now()-t0)/1000)}s`;
    $('#stageTxt').textContent = p.total ? `采样 ${p.step}/${p.total}` : '模型加载 / 编码中…';
    if(j.state === 'done'){
      $('#bar').style.width='100%';
      $('#go').disabled = false;
      showResult(j);
      loadHist();
      loadLibrary().then(()=>{
        const it = LIB.find(x => x.rel === j.rel);
        if(it) $('#meta').innerHTML = `<span>#${it.no}</span>` + $('#meta').innerHTML;
      });
      break;
    }
    if(j.state === 'failed'){
      $('#err').textContent = '生成失败：' + (j.error||'');
      $('#go').disabled = false;
      break;
    }
  }
}

function showResult(j){
  const src = `/api/gallery/${j.artifact}`;
  $('#stage').outerHTML = `<video id="stage" controls autoplay loop src="${src}"></video>`;
  $('#meta').innerHTML = `<span>${j.artifact}</span><span>${j.duration ?? ''} 秒</span><span>${j.frames} 帧</span><span>模式：${j.mode==='continue'?'衔接':'单段'}</span>`;
  $('#actions').style.display='flex';
  $('#dl').href = src;
  $('#dl').download = j.artifact;
  $('#contThis').onclick = ()=>{
    contAnchor = {type:'video', value: j.rel || ''};
    setMode('continue');
    if(j.rel){
      const opt = document.createElement('option');
      opt.value = j.rel; opt.textContent = j.artifact + '（刚生成）';
      $('#contVideo').prepend(opt); $('#contVideo').value = j.rel;
    }
    $('#stageTxt').textContent='已把这段设为衔接源，写新提示词后点生成';
  };
}

async function loadOutputs(){
  const r = await fetch('/api/outputs'); const j = await r.json();
  const sel = $('#contVideo');
  sel.innerHTML = '';
  j.items.slice(0,30).forEach(it=>{
    const o = document.createElement('option');
    o.value = it.rel; o.textContent = `${it.name} · ${it.dur}s · ${it.w}x${it.h}`;
    sel.appendChild(o);
  });
}

async function loadHist(){
  const r = await fetch('/api/jobs'); const j = await r.json();
  const box = $('#hist');
  if(!j.items.length){ box.innerHTML = '<span class="pill">还没有记录</span>'; return; }
  box.innerHTML = j.items.map(it=>{
    const st = it.state==='done' ? '✅' : it.state==='failed' ? '❌' : '⏳';
    return `<div><span>${st} ${it.duration}s · ${it.frames}帧</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${(it.prompt||'').slice(0,40)}…</span><span>${it.elapsed? Math.round(it.elapsed)+'s':''}</span></div>`;
  }).join('');
}

// ---------- 作品库 ----------
let LIB = [];
async function loadLibrary(){
  const box = $('#lib');
  try{
    const r = await fetch('/api/outputs'); const j = await r.json();
    LIB = j.items || [];
    $('#libCount').textContent = LIB.length ? `共 ${j.total ?? LIB.length} 条` : '';
    if(!LIB.length){ box.innerHTML = '<span class="pill">输出目录里没有视频</span>'; return; }
    box.innerHTML = '';
    LIB.forEach(it=>{
      const d = document.createElement('div');
      d.className = 'item';
      d.title = `#${it.no} · ${it.name}\n${it.dur}s · ${it.w}x${it.h} · ${it.mb}MB`;
      d.innerHTML = `<span class="no">#${it.no}</span>
        <img loading="lazy" src="/api/thumb?rel=${encodeURIComponent(it.rel)}">
        <div class="cap"><b>${it.dur}s</b><span>${it.mb}MB</span></div>`;
      d.onclick = ()=>playArchive(it);
      box.appendChild(d);
    });
  }catch(e){ box.innerHTML = '<span class="pill">读取失败：' + e.message + '</span>'; }
}

function playArchive(it){
  $('#stage').outerHTML = `<video id="stage" controls autoplay loop src="/api/video?no=${it.no}"></video>`;
  $('#meta').innerHTML = `<span>#${it.no}</span><span>${it.name}</span><span>${it.dur} 秒</span><span>${it.w}×${it.h}</span><span>${it.mb} MB</span>`;
  $('#actions').style.display='flex';
  $('#dl').href = `/api/video?no=${it.no}`; $('#dl').download = it.name;
  $('#contThis').onclick = ()=>{
    contAnchor = {type:'video', value: it.rel};
    setMode('continue');
    const sel = $('#contVideo');
    if(![...sel.options].some(o=>o.value===it.rel)){
      const o = document.createElement('option'); o.value = it.rel; o.textContent = `#${it.no} · ${it.name}`; sel.prepend(o);
    }
    sel.value = it.rel;
    $('#stageTxt').textContent = `已把 #${it.no} 设为衔接源，写新提示词后点生成`;
  };
}
$('#libRefresh').onclick = loadLibrary;
$('#jumpGo').onclick = ()=>{
  const n = parseInt($('#jumpNo').value, 10);
  const it = LIB.find(x => x.no === n);
  if(it) playArchive(it);
  else $('#err').textContent = `没有编号 #${n} 的视频`;
};

async function health(){
  try{
    const r = await fetch('/api/health'); const j = await r.json();
    $('#dot').classList.toggle('on', !!j.comfy);
    $('#comfyState').textContent = j.comfy ? 'ComfyUI 在线' : 'ComfyUI 未启动';
  }catch(e){ $('#comfyState').textContent = '服务异常'; }
}
health(); setInterval(health, 5000);
loadOutputs(); loadHist(); loadLibrary();
</script>
</body>
</html>
